services:
  postgres:
    image: postgres:16-alpine
    container_name: controlecartao-postgres
    environment:
      POSTGRES_USER: controlecartao
      POSTGRES_PASSWORD: controlecartao
      POSTGRES_DB: controlecartao
    ports:
      - "5432:5432"
    volumes:
      - controlecartao_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U controlecartao -d controlecartao"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  controlecartao_postgres_data:
